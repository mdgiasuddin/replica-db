services:

  postgres-primary:
    image: postgres:16
    container_name: postgres-primary
    hostname: postgres-primary
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./db-replica/primary-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db-replica/replication-config.sh:/docker-entrypoint-initdb.d/replication-config.sh

    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on

    ports:
      - "5445:5432"

    networks:
      - pg-net

  postgres-replica:
    image: postgres:16
    container_name: postgres-replica
    hostname: postgres-replica
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./db-replica/replica-init.sh:/usr/local/bin/replica-init.sh
    entrypoint: ["/usr/local/bin/replica-init.sh"]
    depends_on:
      - postgres-primary
    ports:
      - "5446:5432"
    networks:
      - pg-net

volumes:
  primary_data:
  replica_data:

networks:
  pg-net: